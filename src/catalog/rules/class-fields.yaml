id: class-fields
message: Detected downlevel helpers for class fields
severity: info
language: javascript
rule:
  any:
    - pattern: function _classPrivateFieldGet($_, $_) { $$$ }
    - pattern: function _classPrivateFieldSet($_, $_, $_) { $$$ }
    - pattern: function _defineProperty($_, $_, $_) { $$$ Object.defineProperty($$$) $$$ }
    - pattern: var _defineProperty = function($_, $_, $_) { $$$ Object.defineProperty($$$) $$$ }
    - pattern: require("@babel/runtime/helpers/defineProperty")
    - pattern: import("@babel/runtime/helpers/defineProperty")
    - pattern: require("@babel/runtime/helpers/classPrivateFieldGet")
    - pattern: import("@babel/runtime/helpers/classPrivateFieldGet")
    - pattern: 'function $FN($R, $E) { return $R.get($BRAND($R, $E)) }'
    - pattern: 'function $FN($R, $E, $T) { return ($E = $TOKEY($E)) in $R ? Object.defineProperty($R, $E, { value: $T, enumerable: !0, configurable: !0, writable: !0 }) : $R[$E] = $T, $R }'
    - pattern: 'function $FN($OBJ, $KEY, $VAL) { return $KEY in $OBJ ? Object.defineProperty($OBJ, $KEY, { value: $VAL, enumerable: $_, configurable: $_, writable: $_ }) : $OBJ[$KEY] = $VAL, $OBJ }'
